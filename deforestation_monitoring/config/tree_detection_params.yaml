# tree_detection_params.yaml: Tuned 2026-09-27 on recorded live maps (tune_on_recording): sparse_trees 5/0/0 on every map at 1.0 …
/**:
  ros__parameters:
    chm_resolution: 0.25
    smooth_sigma: 0.9
    min_height: 1.5
    use_auto_threshold: true
    ground_floor: 0.1
    ground_percentile: 0.2
    ground_margin: 0.5
    auto_threshold_cap: 1.5
    window_scale: 0.35
    window_offset: 0.2
    min_window: 0.5
    max_window: 1.5
    min_sep: 2.5
    saddle_ratio: 0.75
    valley_ratio: 0.1
    valley_offset: 0.2
    crown_scale: 1.5
    crown_offset: 2.0
    min_tree_height: 1.5
    min_crown_cells: 5
    mask_close_iterations: 2
    mask_open_iterations: 1
    pit_fill_size: 3
    centroid_band: 0.5
    position_mode: "auto"
    merge_max_radius: 8.0
    merge_small_area: 0.0
    merge_radius: 5.0
    overlap_threshold: 3.0
    seed_lock: true
    seed_snap: 0.5
    overlap_valley_ratio: 0.75
    band_surface: "raw"
    band_raw_below: 4.0
    band_raw_width: 1.0
    narrow_sigma: 0.25
    narrow_window: 1.0
    narrow_prominence: 0.0
    narrow_saddle_range: 0.0
    narrow_exclusion_radius: 5.5
    narrow_tall_height: 5.2
